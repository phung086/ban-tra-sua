name: Mobile orientation and autofit
on:
  push:
    branches: [codex/mobile-beta-foundation]
    paths:
      - 'src/styles-responsive-play.css'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/game/playLayout*'
      - 'src/components/MovementStick.tsx'
      - 'src/components/StreetWorld.tsx'
      - 'src/components/world/PrepWorld.tsx'
      - 'src/scene/runtime.ts'
      - 'src/styles-mobile-play.css'
      - 'src/styles-world-foundation.css'
      - 'src/styles-street.css'
      - 'scripts/mobile-layout-smoke.mjs'
      - '.github/workflows/mobile-layout.yml'
  workflow_dispatch:

concurrency:
  group: mobile-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and test browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Orientation screenshots and smoke
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 5192 --strictPort > /tmp/mobile-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5192/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5192/ >/dev/null
          node scripts/mobile-layout-smoke.mjs
      - name: Upload screenshots and measured layout boxes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-autofit-${{ github.sha }}
          path: mobile-layout-artifacts/
          retention-days: 21
          if-no-files-found: warn
