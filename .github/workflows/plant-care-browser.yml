name: Plant care production browser
on:
  push:
    branches: ['codex/playable-plant-care-*']
  pull_request:
    branches: [main]
    paths:
      - 'src/game/lifeSim/morning.ts'
      - 'src/components/life/MorningRoutine.tsx'
      - 'scripts/plant-care-browser-smoke.mjs'
      - '.github/workflows/plant-care-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npx vite preview --host 127.0.0.1 --port 5192 &
      - run: node scripts/plant-care-browser-smoke.mjs
