name: CI

on:
  push:
    branches: ["main", "feat/**", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Gameplay tests
        run: npm test
      - name: Benchmark script syntax preflight
        run: node --check scripts/m1-browser-benchmark.mjs
      - name: Typecheck and build
        run: npm run build
